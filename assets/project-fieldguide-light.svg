<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="412" height="200" viewBox="0 0 412 200" role="img" aria-label="OAuth Fieldguide: type a provider, get its OAuth setup guide, every claim labelled verified, inferred or unknown."><title>OAuth Fieldguide: type a provider, get its OAuth setup guide, every claim labelled verified, inferred or unknown.</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.65}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.orbit{transform-box:view-box;animation:spin 14s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.tw{animation:tw 3.2s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.flow{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
.float{animation:float 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
