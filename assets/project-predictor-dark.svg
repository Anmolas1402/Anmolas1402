<svg xmlns="http://www.w3.org/2000/svg" width="412" height="196" viewBox="0 0 412 196" role="img" aria-label="College Predictor: JoSAA, JAC and BITSAT seat prediction, wired into the score calculator. Stress- tested on edge cases before every release. ~10 L VISITS IN 3 MONTHS"><title>College Predictor: JoSAA, JAC and BITSAT seat prediction, wired into the score calculator. Stress- tested on edge cases before every release. ~10 L VISITS IN 3 MONTHS</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes scan{0%{transform:translateX(-60px);opacity:0}15%,85%{opacity:.9}100%{transform:translateX(420px);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.tw{animation:tw 3.2s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.rise{animation:rise .7s ease-out both}
.blink{animation:blink 1.1s steps(1) infinite}
.scan{animation:scan 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
